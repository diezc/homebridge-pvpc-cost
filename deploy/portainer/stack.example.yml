services:
  homebridge:
    image: local/homebridge-pvpc-cost:0.1.0
    container_name: homebridge
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      ESIOS_API_TOKEN: ${ESIOS_API_TOKEN:-}
    ports:
      - "8581:8581"
    volumes:
      - /srv/homebridge:/homebridge

# Replace your existing Homebridge service image with the custom image built on the server.
# Keep your current ports, volumes, labels, networks, and any extra Portainer options.
